# Also APP_ID in src/main/main.js. Changing it later makes Windows treat the app as a different program.
appId: com.streammyevent.producers-toolbox
# The userData folder name (src/main/main.js, build/installer.nsh): never rename it, or users lose their data.
productName: Producers Toolbox
copyright: Copyright © 2026 Stream My Event
directories:
  output: dist
  buildResources: build
# Tools go inside app.asar, so asar integrity also covers each tool's api.js (it runs in the main process).
files:
  - out/**/*
  - src/renderer/**/*
  - package.json
  - from: ../../tools
    to: tools
    filter: ["*/tool.json", "*/api.js", "*/lib/**", "*/web/**"]
afterPack: build/verify-asar.js
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
publish:
  provider: github
  owner: streammyevent
  repo: producers-toolbox
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: build/icon.ico
  # Signing (Azure Artifact Signing, azureSignOptions) is configured by .github/workflows/release.yml from repository
  # variables. Its publisherName ends up in app-update.yml, and electron-updater checks every update against it.
nsis:
  # No spaces: the name must equal the GitHub release asset name that latest.yml points at.
  artifactName: Producers-Toolbox-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Producers Toolbox
  uninstallDisplayName: Producers Toolbox
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  # electron-updater downloads the zip; the dmg is for first installs.
  target:
    - { target: dmg, arch: [x64, arm64] }
    - { target: zip, arch: [x64, arm64] }
  artifactName: Producers-Toolbox-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  icon: build/icon.png
  # Signed with the Developer ID certificate in CSC_LINK and notarized with the App Store Connect key in APPLE_API_KEY*
  # (release.yml). Without them (local builds) both steps are skipped with a warning.
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Smoelenboek uses the camera to take speaker photos.
