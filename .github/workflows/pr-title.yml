name: PR title

# Squash merges use the PR title as the commit message, and release-please reads those commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]'; then
            echo "::error::The PR title must be a Conventional Commit, for example: feat(smoelenboek): add camera capture"
            printf 'Title: %s\n' "$TITLE"
            exit 1
          fi
