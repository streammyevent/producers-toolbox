<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Network Tool</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <header>
      <div class="hero">
        <canvas class="globe" id="globe" aria-hidden="true"></canvas>
        <div class="brand">
          <h1 class="sr">Network Tool</h1>
          <pre class="art glow logo" id="logo" aria-hidden="true"></pre>
          <div class="tag glow">NETWORK TOOL</div>
        </div>
        <div class="controls">
          <span class="net netinfo" id="net"></span>
          <select id="iface" title="Network connection" hidden></select>
          <span class="net" id="when"></span>
          <span class="net np" id="np" hidden></span>
          <button class="music" id="music" aria-pressed="false">Music: off</button>
          <button class="ghost" id="next" title="Next track" aria-label="Next track" hidden>»</button>
          <button id="rescan" hidden>Scan again</button>
        </div>
      </div>
    </header>
    <main id="main"></main>
    <footer><button id="credits">Credits &amp; licenses</button></footer>
    <dialog class="credits px" id="creditsDlg" aria-label="Credits and licenses">
      <button id="creditsClose">Close</button>
      <pre id="creditsText"></pre>
    </dialog>
  </body>
</html>
